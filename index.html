<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google" content="notranslate">
  <base href="/spot/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Spot — a fair shared Spotify queue for parties">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Spot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Spot</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    body { margin: 0; background-color: #121212; }
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background-color: #121212; font-family: sans-serif;
    }
    #loading .title { color: #1DB954; font-size: 2.5rem; font-weight: bold; letter-spacing: 0.3rem; margin-bottom: 2rem; }
    #loading .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #1DB954; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <div id="loading">
    <div class="title">SPOT</div>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
    // Capture the browser's install prompt (fires before Dart loads) so the
    // page can offer "Install" itself; see lib/member/install_hint.dart.
    window._deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window._deferredInstallPrompt = e;
    });
    window.addEventListener('appinstalled', function () {
      window._deferredInstallPrompt = null;
    });
    window._spotPromptInstall = function () {
      var p = window._deferredInstallPrompt;
      if (!p) return Promise.resolve(false);
      window._deferredInstallPrompt = null;
      return p.prompt().then(function () { return true; });
    };
    window._spotCanPromptInstall = function () { return !!window._deferredInstallPrompt; };
  </script>

  <!-- Firebase Cloud Messaging (fcm-switch project) via the compat SDK; the
       Dart side talks to these helpers through JS interop (lib/member/web_push.dart). -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyDdsNrnheLnhAe5fPJNkQo86f40DgBdg5I",
      appId: "1:245672555479:web:01dd2824ac0ff9e94e9192",
      messagingSenderId: "245672555479",
      projectId: "fcm-switch",
      authDomain: "fcm-switch.firebaseapp.com",
      storageBucket: "fcm-switch.firebasestorage.app",
    });
    var _spotMessaging = firebase.messaging();
    window._spotGetToken = function(swReg, vapidKey) {
      return _spotMessaging.getToken({ vapidKey: vapidKey, serviceWorkerRegistration: swReg });
    };
    window._spotOnMessage = null;
    _spotMessaging.onMessage(function(payload) {
      if (window._spotOnMessage && payload.data) {
        window._spotOnMessage(JSON.stringify(payload.data));
      }
    });

    // QR scanning: native BarcodeDetector (Chrome Android) with a jsQR fallback.
    window._spotDetectQR = async function(videoElement) {
      if (typeof BarcodeDetector !== 'undefined') {
        try {
          const detector = new BarcodeDetector({formats: ['qr_code']});
          const results = await detector.detect(videoElement);
          if (results.length > 0) return results[0].rawValue;
          return null;
        } catch(e) {}
      }
      if (!window._jsQR) return null;
      const canvas = document.createElement('canvas');
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;
      if (canvas.width === 0 || canvas.height === 0) return null;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = window._jsQR(imageData.data, imageData.width, imageData.height);
      return code ? code.data : null;
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>window._jsQR = jsQR;</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
